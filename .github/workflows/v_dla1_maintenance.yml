name: V563 DLA1 cJSON historical edit Rust natural maintenance counterbaseline
on:
  pull_request:
    paths:
      - 'experiments/value/dla1_maintenance/**'
      - '.github/workflows/v_dla1_maintenance.yml'

permissions:
  contents: read

jobs:
  pinned-actual-before-after:
    name: DLA1 pinned Rust 1.99.0 native before/change comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_AUTO_INSTALL: "0"
    steps:
      - name: Checkout frozen V branch without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preflight true existing toolchain and source SHA before compiler
        shell: bash
        run: |
          set -euo pipefail
          env | grep -E '^Image(OS|Version)=' || true
          rustc --version --verbose
          test "$(rustc --version | awk '{print $2}')" = 1.99.0 || { echo DLA1_TOOLCHAIN_INCONCLUSIVE; exit 78; }
          if command -v rustup >/dev/null 2>&1; then
            echo "RUSTC_BIN=$(rustup which rustc)"
            sha256sum "$(rustup which rustc)"
          fi
          cd experiments/value/dla1_maintenance
          sha256sum -c manifest.sha256
          cat manifest.sha256
          echo DLA1_SHA_FREEZE_VALID
      - name: Actual Rust pre-change API build, test, native
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/value/dla1_maintenance
          rustc --edition=2021 -D warnings --test rust_before.rs -o "$RUNNER_TEMP/dla1_before_tests"
          "$RUNNER_TEMP/dla1_before_tests" --nocapture | tee "$RUNNER_TEMP/dla1_before_test.log"
          grep -F "test result: ok. 1 passed; 0 failed" "$RUNNER_TEMP/dla1_before_test.log"
          rustc --edition=2021 -D warnings rust_before.rs -o "$RUNNER_TEMP/dla1_before_native"
          "$RUNNER_TEMP/dla1_before_native" | tee "$RUNNER_TEMP/dla1_before_native.log"
          grep -Fx "DLA1_RUST_BEFORE_OK stable_original_boxes; append; safe_get; freed2" "$RUNNER_TEMP/dla1_before_native.log"
          echo DLA1_BEFORE_NATIVE_PASS
      - name: Actual Rust post-change API build, full historical maintenance oracle
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/value/dla1_maintenance
          rustc --edition=2021 -D warnings --test rust_after.rs -o "$RUNNER_TEMP/dla1_after_tests"
          "$RUNNER_TEMP/dla1_after_tests" --nocapture | tee "$RUNNER_TEMP/dla1_after_test.log"
          grep -F "test result: ok. 4 passed; 0 failed" "$RUNNER_TEMP/dla1_after_test.log"
          rustc --edition=2021 -D warnings rust_after.rs -o "$RUNNER_TEMP/dla1_after_native"
          "$RUNNER_TEMP/dla1_after_native" | tee "$RUNNER_TEMP/dla1_after_native.log"
          grep -Fx "DLA1_RUST_AFTER_OK old_contract; last_delete_append; same_box_detach_reparent; head_middle_last_singleton; frees_exact" "$RUNNER_TEMP/dla1_after_native.log"
          echo DLA1_AFTER_NATIVE_PASS
      - name: Record actual textual code change and tracked author/API surface
        shell: bash
        run: |
          set -euo pipefail
          cd experiments/value/dla1_maintenance
          set +e
          diff -u rust_before.rs rust_after.rs
          status=$?
          set -e
          test "$status" -eq 1
          echo DLA1_DIFF_VISIBLE_NOT_PERSONHOURS
