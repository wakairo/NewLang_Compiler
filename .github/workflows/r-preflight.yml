name: T847 isolated R-FAST preparation (NOT proof)

on:
  push:
    branches:
      - t847-r-fast-isolated-20261024

permissions:
  contents: read

concurrency:
  group: t847-r-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: T847 FAST FORMAT + HOST BUILD + CTest inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable push SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false

      - name: Verify exact pilot event/head/changed paths and tracked formatter input
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/t847-r-fast-isolated-20261024"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 776e7c8368cb8da4c819df8e9416d37f2c9ead79^{commit}
          expected_paths=$(printf '%s\n' .github/workflows/r-preflight.yml tests/t847/format_probe.c)
          actual_paths=$(git diff --name-only 776e7c8368cb8da4c819df8e9416d37f2c9ead79 HEAD)
          test "$actual_paths" = "$expected_paths"
          git ls-files --error-unmatch tests/t847/format_probe.c
          git ls-files -z -- '*.c' '*.h' | tr '\0' '\n' | grep -Fx tests/t847/format_probe.c
          echo "T847 event=$GITHUB_EVENT_NAME ref=$GITHUB_REF SHA=$GITHUB_SHA attempt=$GITHUB_RUN_ATTEMPT"
          echo "T847 fixture SHA256=$(sha256sum tests/t847/format_probe.c)"
          echo "T847 exact changed paths checked"

      - name: Signed Ubuntu prerequisites (unchanged trust)
        shell: bash
        run: |
          set -euo pipefail
          cmake_before=$(command -v cmake)
          cmake_version=$(cmake --version | sed -n '1s/^cmake version //p')
          python3 - "$cmake_version" <<'PY'
          import re
          import sys
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not match:
              sys.exit("STOP: unexpected CMake version")
          major, minor, patch = map(int, match.groups())
          if not ((3, 28) <= (major, minor) < (4, 0)):
              sys.exit("STOP: CMake outside reviewed interval")
          PY
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-13 g++-13 make python3 zstd \
            libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev
          test "$(command -v cmake)" = "$cmake_before"
          test "$(cmake --version | sed -n '1s/^cmake version //p')" = "$cmake_version"

      - name: Restore untrusted fixed-SHA curated SDK archive cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133

      - name: Bootstrap SHA-verified pinned LLVM 23.1.3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bootstrap.py
          . .deps/activate.sh
          clang-format-23 --version | grep -F '23.1.3'

      - name: Strict pinned formatting (fail closed; never alter source)
        shell: bash
        env:
          FORMAT_SUGGESTIONS_PATCH: ${{ runner.temp }}/t847-format-suggestions.patch
        run: |
          set -euo pipefail
          . .deps/activate.sh
          bash scripts/check-format.sh
          echo 'T847 FORMAT PASS (not semantics)'

      - name: Upload review-only formatter suggestions on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t847-format-suggestions-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/t847-format-suggestions.patch
          if-no-files-found: ignore
          retention-days: 7

      - name: GCC frontend-only host build and CTest name inventory (NO test execution)
        shell: bash
        run: |
          set -euo pipefail
          . .deps/activate.sh
          CC=gcc cmake -S . -B build-frontend \
            -DCMAKE_BUILD_TYPE=Debug -DNEWLANG_FRONTEND_ONLY=ON \
            | tee "$RUNNER_TEMP/t847-configure.log"
          grep -F "Frontend-only: LLVM discovery and llvm.c_api smoke omitted" "$RUNNER_TEMP/t847-configure.log"
          grep -Fx "NEWLANG_FRONTEND_ONLY:BOOL=ON" build-frontend/CMakeCache.txt
          n=$(nproc)
          case "$n" in
            ""|*[!0-9]*) echo "STOP invalid nproc: $n"; exit 1 ;;
          esac
          if test "$n" -lt 1; then exit 1; fi
          build_start=$SECONDS
          cmake --build build-frontend --parallel "$n"
          echo "T847 build_wall_seconds=$((SECONDS - build_start)) workers=$n"
          ctest --test-dir build-frontend -N | tee "$RUNNER_TEMP/t847-ctest-inventory.txt"
          python3 - "$RUNNER_TEMP/t847-ctest-inventory.txt" <<'PY'
          import pathlib
          import re
          import sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          names = re.findall(r"(?m)^\s*Test\s+#\d+:\s*(\S+)\s*$", text)
          total = re.search(r"(?m)^Total Tests:\s*(\d+)\s*$", text)
          required = ("cli.check_source", "frontend_build_policy.integration",
                      "nested_u8_checked_c.integration", "bootstrap_retry.offline")
          if not total or int(total.group(1)) != len(names) or len(names) != 451:
              raise SystemExit(f"STOP: CTest inventory count mismatch: {len(names)}")
          if len(set(names)) != len(names) or "llvm.c_api" in names or any(x not in names for x in required):
              raise SystemExit("STOP: CTest inventory identity mismatch")
          print(f"T847 FAST REGISTRATION PASS count={len(names)}; SEMANTIC/PROOF/NATIVE/SANITIZER NOT TESTED", flush=True)
          PY
