name: R588 final bounded independent lexical original native
on:
  push:
    branches: [r588-final-calibrated-20261018]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r588-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout R-only frozen evidence and corrected observer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 20
          path: evidence
      - name: Checkout immutable P576 candidate (not main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 87fc878b52763858f69678a8350d8c1b66a061bb
          path: candidate
      - name: Preflight fixed SHA / unchanged R580 and R583 evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "87fc878b52763858f69678a8350d8c1b66a061bb"
          git -C evidence cat-file -e 38e1dbd2874c12983635ae4e7ff320f94566b613:tests/r580/frozen_oracle.json
          git -C evidence diff --exit-code 1706e6d1a380d3af7819f0380af698d7f89e32cf HEAD -- tests/r580 tests/r583
          test "$(git -C evidence hash-object tests/r580/public_probe.c)" = "5a5e0da60dddf599b299b69ed69745c543cb7b50"
          echo "aaed64f7a17829acb44195250835a820bcad64a45df89f8cd602b8b7af62665a  evidence/tests/r583/calibrated.nl" | sha256sum -c -
          python3 -m py_compile evidence/tests/r588/final_run.py
          grep -Fq 'static const nl_node *const *c_ptr;' evidence/tests/r588/final_run.py
          grep -Fq 'static const nl_node *const *b_ptr;' evidence/tests/r588/final_run.py
          ! grep -Fq 'static const nl_node *const *c_ptr,*b_ptr;' evidence/tests/r588/final_run.py
          sha256sum evidence/tests/r588/final_run.py
          git -C candidate rev-parse HEAD
          git -C evidence rev-parse HEAD
      - name: Build immutable candidate with R-only public inspector
        shell: bash
        run: |
          set -euo pipefail
          cat >> candidate/CMakeLists.txt <<'CMAKE'
          add_executable(r588_public_probe "${CMAKE_CURRENT_SOURCE_DIR}/../evidence/tests/r583/calibrated_probe.c")
          target_include_directories(r588_public_probe PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/tests/support" "${CMAKE_CURRENT_SOURCE_DIR}/src")
          target_link_libraries(r588_public_probe PRIVATE newlang_checked_c_node newlang_semantic)
          CMAKE
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Debug -DNEWLANG_FRONTEND_ONLY=ON
          cmake --build candidate/build --parallel 2 --target newlangc node_checked_probe r588_public_probe
      - name: R588 genuine registered source public validator strict C17 native and negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -u evidence/tests/r588/final_run.py \
            candidate/build/newlangc \
            candidate/build/node_checked_probe \
            candidate/build/r588_public_probe
