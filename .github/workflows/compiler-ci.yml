name: Compiler validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc-13
            sanitizer: none
          - name: GCC Release
            compiler: gcc-13
            sanitizer: none
            build_type: Release
          - name: Clang
            compiler: clang-23
            sanitizer: none
          - name: ASan
            compiler: clang-23
            sanitizer: address
          - name: UBSan
            compiler: clang-23
            sanitizer: undefined
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Host prerequisites from signed Ubuntu repositories
        run: |
          set -euo pipefail
          echo "T757 Stage A1: preinstalled tools before signed apt"
          echo "T757 ImageOS=${ImageOS:-unset} ImageVersion=${ImageVersion:-unset} PATH=$PATH"
          for tool in cmake gcc-13 g++-13 make python3 zstd; do
            echo "T757 tool $tool=$(command -v "$tool")"
          done
          cmake_before=$(command -v cmake)
          cmake_version=$(cmake --version | sed -n '1s/^cmake version //p')
          echo "T757 cmake_before=$cmake_before version=$cmake_version"
          python3 - "$cmake_version" <<'PY'
          import re
          import sys
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if not match:
              sys.exit("STOP: unknown preinstalled CMake version")
          major, minor, patch = map(int, match.groups())
          if not ((3, 28) <= (major, minor) < (4, 0)):
              sys.exit("STOP: preinstalled CMake outside project policy [3.28,4.0)")
          PY
          for pkg in gcc-13 g++-13 make python3 zstd libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev; do
            dpkg-query -W -f='${binary:Package}=${Status} ${Version}\n' "$pkg" || true
          done
          apt_started=$(date +%s)
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-13 g++-13 make python3 zstd \
            libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev
          echo "T757 A1 apt_seconds=$(( $(date +%s) - apt_started ))"
          test "$(command -v cmake)" = "$cmake_before"
          echo "T757 cmake_after=$(command -v cmake) version=$(cmake --version | sed -n '1s/^cmake version //p')"
          test "$(cmake --version | sed -n '1s/^cmake version //p')" = "$cmake_version"
      - name: Restore untrusted fixed-SHA curated SDK archive cache
        id: sdk-cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133
      - name: Bootstrap SHA-verified curated LLVM 23.1.3 (cache or fixed Release)
        run: python3 scripts/bootstrap.py
      - name: Check C formatting and provide exact pinned-formatter correction
        if: matrix.name == 'Clang'
        run: |
          . .deps/activate.sh
          echo "Actions commit: $GITHUB_SHA; checked HEAD: $(git rev-parse HEAD)"
          echo "PR head: ${{ github.event.pull_request.head.sha }}"
          FORMAT_SUGGESTIONS_PATCH="$RUNNER_TEMP/format-suggestions.patch" bash scripts/check-format.sh

      - name: Upload formatter suggestions (untrusted; inspect before git apply)
        if: ${{ always() && matrix.name == 'Clang' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clang-format-suggestions-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/format-suggestions.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure, build, and test
        env:
          CC: ${{ matrix.compiler }}
          # Clang 23.1.3 emits this known GCC libstdc++ install-dir warning on
          # some Ubuntu GCC13/14 hosts. It stays a warning; unrelated -Werror
          # and every sanitizer/test rejection remain intact.
          CFLAGS: ${{ matrix.compiler == 'clang-23' && '-Wno-error=gcc-install-dir-libstdcxx' || '' }}
        run: |
          . .deps/activate.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }} \
            -DNEWLANG_SANITIZER=${{ matrix.sanitizer }}
          echo "T753 runner nproc=$(nproc) nproc_all=$(nproc --all)"
          echo "T753 affinity=$(grep "^Cpus_allowed_list:" /proc/self/status || true)"
          grep -E "^Mem(Total|Available):" /proc/meminfo | sed "s/^/T753 /"
          for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory.current; do
            if test -r "$f"; then echo "T753 $f=$(cat "$f")"; fi
          done
          ctest --version | head -n 1
          detected_nproc=$(nproc)
          case "$detected_nproc" in
            ""|*[!0-9]*) echo "::error::T753 invalid nproc: $detected_nproc"; exit 1 ;;
          esac
          if test "$detected_nproc" -lt 1; then echo "::error::T753 nproc must be positive"; exit 1; fi
          ctest_cap=4
          if test "${{ matrix.name }}" = "ASan" || test "${{ matrix.name }}" = "UBSan"; then ctest_cap=2; fi
          ctest_workers="$detected_nproc"
          if test "$ctest_workers" -gt "$ctest_cap"; then ctest_workers="$ctest_cap"; fi
          echo "T753 chosen CTest workers=$ctest_workers detected=$detected_nproc cap=$ctest_cap"
          build_started=$(date +%s)
          cmake --build build --parallel 2
          echo "T753 build_wall_seconds=$(( $(date +%s) - build_started ))"
          ctest_started=$(date +%s)
          set +e
          if test "${{ matrix.name }}" = "ASan" || test "${{ matrix.name }}" = "UBSan"; then
            python3 - "$ctest_workers" <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import time
          
          workers = sys.argv[1]
          proc = subprocess.Popen(
              ["ctest", "--test-dir", "build", "--parallel", workers, "--output-on-failure"]
          )
          started = time.monotonic()
          cg_path = None
          mount_point = None
          cg_error = "no cgroup2 mount/self path"
          try:
              rel = next(
                  (line.split("::", 1)[1].strip() for line in
                   pathlib.Path("/proc/self/cgroup").read_text().splitlines()
                   if line.startswith("0::")), None
              )
              if rel is not None:
                  for line in pathlib.Path("/proc/self/mountinfo").read_text().splitlines():
                      pre, sep, post = line.partition(" - ")
                      if sep and post.split()[0] == "cgroup2":
                          f = pre.split()
                          root, mount = pathlib.Path(f[3]), pathlib.Path(f[4])
                          sub = pathlib.Path(rel)
                          try:
                              suffix = sub.relative_to(root)
                          except ValueError:
                              continue
                          candidate = mount / suffix
                          if candidate.is_dir():
                              cg_path, mount_point = candidate, mount
                              cg_error = "none"
                              break
          except Exception as ex:
              cg_error = type(ex).__name__
          
          def read(name, folder=None):
              if folder is None:
                  folder = cg_path
              if folder is None:
                  return None
              try:
                  return (folder / name).read_text().strip()
              except (OSError, ValueError):
                  return None
          
          def integer(name, folder=None):
              raw = read(name, folder)
              try:
                  return int(raw) if raw is not None and raw != "max" else None
              except ValueError:
                  return None
          
          limits = []
          if cg_path is not None:
              folder = cg_path
              while True:
                  limit = integer("memory.max", folder)
                  if limit is not None:
                      limits.append(limit)
                  if folder == mount_point or folder.parent == folder:
                      break
                  folder = folder.parent
          effective_limit = min(limits) if limits else None
          cpu_raw = read("cpu.max")
          cpu_quota = None
          if cpu_raw:
              fields = cpu_raw.split()
              if len(fields) == 2 and fields[0] != "max":
                  try:
                      cpu_quota = int(fields[0]) / int(fields[1])
                  except (ValueError, ZeroDivisionError):
                      pass
          cpu_stat_start = read("cpu.stat")
          event_start = read("memory.events")
          swap_start = integer("memory.swap.current")
          pressure_start = read("cpu.pressure")
          peak_file_start = integer("memory.peak")
          max_current = 0
          max_rss_sum = 0
          max_descendants = 0
          samples = 0
          sample_errors = 0
          
          def descendant_rss():
              parents = {}
              rss = {}
              for pidstr in os.listdir("/proc"):
                  if not pidstr.isdigit():
                      continue
                  try:
                      stat = pathlib.Path("/proc", pidstr, "stat").read_text()
                      fields = stat[stat.rfind(")") + 2:].split()
                      parents[int(pidstr)] = int(fields[1])
                      status = pathlib.Path("/proc", pidstr, "status").read_text()
                      item = next((line for line in status.splitlines()
                                   if line.startswith("VmRSS:")), None)
                      rss[int(pidstr)] = int(item.split()[1]) * 1024 if item else 0
                  except (OSError, ValueError, IndexError):
                      continue
              active = {proc.pid}
              while True:
                  extra = {pid for pid, parent in parents.items() if parent in active}
                  if extra.issubset(active):
                      break
                  active |= extra
              return sum(rss.get(pid, 0) for pid in active), len(active)
          
          def sample():
              global max_current, max_rss_sum, max_descendants, samples, sample_errors
              samples += 1
              val = integer("memory.current")
              if val is not None:
                  max_current = max(max_current, val)
              try:
                  rss, count = descendant_rss()
                  max_rss_sum = max(max_rss_sum, rss)
                  max_descendants = max(max_descendants, count)
              except (OSError, ValueError):
                  sample_errors += 1
          
          try:
              while proc.poll() is None:
                  sample()
                  try:
                      proc.wait(timeout=0.75)
                  except subprocess.TimeoutExpired:
                      pass
              sample()
          finally:
              code = proc.wait()
          elapsed = round(time.monotonic() - started, 3)
          peak_file_end = integer("memory.peak")
          event_end = read("memory.events")
          swap_end = integer("memory.swap.current")
          pressure_end = read("cpu.pressure")
          cpu_stat_end = read("cpu.stat")
          print(
              f"T760 sampler=M0 cap2 result={code} monitor_wall_seconds={elapsed} "
              f"samples={samples} interval_target_ms=750 sample_errors={sample_errors}",
              flush=True
          )
          print(
              f"T760 cgroup2={cg_path is not None} lookup_error={cg_error} "
              f"finite_memory_limit_bytes={effective_limit} cpu_max={cpu_raw!r} "
              f"cpu_quota_cores={cpu_quota} observed_memory_current_peak_bytes="
              f"{max_current if max_current else None} memory_peak_file_start={peak_file_start} "
              f"memory_peak_file_end={peak_file_end}",
              flush=True
          )
          print(
              f"T760 memory_events_start={event_start!r} memory_events_end={event_end!r} "
              f"swap_current_start={swap_start} swap_current_end={swap_end} "
              f"cpu_stat_start={cpu_stat_start!r} cpu_stat_end={cpu_stat_end!r}",
              flush=True
          )
          print(
              f"T760 cpu_pressure_start={pressure_start!r} "
              f"cpu_pressure_end={pressure_end!r} "
              f"descendant_sample_rss_sum_max_bytes={max_rss_sum} "
              f"descendant_count_max={max_descendants} "
              "rss_is_non_authoritative_shared_pages_double_counted_short_lived_children_missed=True",
              flush=True
          )
          sys.exit(code)
          PY
            ctest_status=$?
          else
            ctest --test-dir build --parallel "$ctest_workers" --output-on-failure
            ctest_status=$?
          fi
          set -e
          echo "T753 ctest_wall_seconds=$(( $(date +%s) - ctest_started )) exit=$ctest_status"
          if test -r /sys/fs/cgroup/memory.peak; then echo "T753 memory_peak_bytes=$(cat /sys/fs/cgroup/memory.peak)"; fi
          exit "$ctest_status"

      - name: Save verified original archive only on trusted successful main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133
