name: Compiler validation

on:
  pull_request:
  push:
    branches: [main, t430-verified-deb-cache-trial]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc-13
            sanitizer: none
          - name: GCC Release
            compiler: gcc-13
            sanitizer: none
            build_type: Release
          - name: Clang
            compiler: clang-23
            sanitizer: none
          - name: ASan
            compiler: clang-23
            sanitizer: address
          - name: UBSan
            compiler: clang-23
            sanitizer: undefined
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Host prerequisites from signed Ubuntu repositories
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-13 g++-13 make cmake python3 dpkg \
            libstdc++6 libz3-4 libxml2 libpfm4 libedit2 libzstd1 libffi8
      # T430: only trusted repository pushes can read/write this experimental cache.
      # PR/fork runs retain the unchanged cold-download behavior.
      - name: Enumerate exact locked Debian packages
        if: >-
          github.event_name == 'push' &&
          github.repository == 'wakairo/NewLang_Compiler' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/t430-verified-deb-cache-trial')
        id: deb_manifest
        env:
          LOCK_HASHFILES: ${{ hashFiles('scripts/toolchain-lock.json') }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          raw = Path("scripts/toolchain-lock.json").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          if digest != os.environ["LOCK_HASHFILES"]:
              raise SystemExit("T430: lock digest mismatch or empty hashFiles")
          packages = json.loads(raw)["platforms"]["ubuntu-24.04-x86_64"]["packages"]
          paths = []
          for package in packages:
              name, sha = package["name"], package["sha256"]
              if not re.fullmatch(r"[A-Za-z0-9+_.-]+", name) or not re.fullmatch(r"[0-9a-f]{64}", sha):
                  raise SystemExit("T430: invalid locked package path")
              paths.append(f".deps/downloads/{name}-{sha}.deb")
          if not paths or len(paths) != len(set(paths)):
              raise SystemExit("T430: empty or duplicate locked paths")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"digest={digest}\npaths<<T430_PATHS\n")
              out.write("\n".join(paths) + "\nT430_PATHS\n")
          print(f"T430 locked manifest: {len(paths)} packages; lock SHA256 {digest}")
          PY
      - name: Restore and cache only locked verified .deb files
        if: steps.deb_manifest.outcome == 'success'
        id: deb_cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # pinned GitHub action, Node 24
        with:
          path: ${{ steps.deb_manifest.outputs.paths }}
          key: t430-locked-deb-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.deb_manifest.outputs.digest }}
          enableCrossOsArchive: false
          # No restore-keys: no stale lock/OS/arch fallback.
      - name: Reject unexpected restored paths before bootstrap
        if: steps.deb_manifest.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path("scripts/toolchain-lock.json").read_text())
          expected = {f"{p['name']}-{p['sha256']}.deb" for p in
                      lock["platforms"]["ubuntu-24.04-x86_64"]["packages"]}
          for folder in (Path(".deps"), Path(".deps/downloads")):
              if folder.is_symlink() or (folder.exists() and not folder.is_dir()):
                  raise SystemExit(f"T430: unexpected cache directory: {folder}")
          directory = Path(".deps/downloads")
          restored = list(directory.iterdir()) if directory.exists() else []
          for path in restored:
              if path.name not in expected or path.is_symlink() or not path.is_file():
                  raise SystemExit(f"T430: unexpected cache member: {path}")
          print(f"T430 restored regular files: {len(restored)}/{len(expected)}")
          PY
      - name: Bootstrap checksum-locked LLVM 23.1.2
        run: python3 scripts/bootstrap.py
      - name: Check C formatting
        if: matrix.name == 'Clang'
        run: |
          . .deps/activate.sh
          bash scripts/check-format.sh
      - name: Configure, build, and test
        env:
          CC: ${{ matrix.compiler }}
        run: |
          . .deps/activate.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Debug' }} \
            -DNEWLANG_SANITIZER=${{ matrix.sanitizer }}
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: Validate publisher inventory and SHA before cache post-save
        if: steps.deb_manifest.outcome == 'success'
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          lock = json.loads(Path("scripts/toolchain-lock.json").read_text())
          packages = lock["platforms"]["ubuntu-24.04-x86_64"]["packages"]
          expected = {f"{p['name']}-{p['sha256']}.deb": p["sha256"] for p in packages}
          directory = Path(".deps/downloads")
          if directory.is_symlink() or not directory.is_dir():
              raise SystemExit("T430: unsafe downloads directory")
          actual = {p.name for p in directory.iterdir()}
          if actual != set(expected):
              raise SystemExit(f"T430: unexpected/missing cache files: {actual ^ set(expected)}")
          for name, digest in expected.items():
              path = directory / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"T430: non-regular package: {name}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"T430: package checksum mismatch: {name}")
          print(f"T430 publisher verified SHA256 for {len(packages)} regular .deb files")
          PY
