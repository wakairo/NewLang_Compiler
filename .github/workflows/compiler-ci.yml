# T441 one-shot isolated trusted-branch restore audit. DO NOT MERGE.
# Historical T430 producer: 61cc2c7918aada289b9098dc91153c5f5ab77dea.
# Do not add pull_request: or a matrix; do not invoke compiler bootstrap.
name: T441 trusted cache restore-only audit

on:
  push:
    branches: [t430-verified-deb-cache-trial]

permissions:
  contents: read

jobs:
  restore:
    name: T441 exact 12-package byte audit
    if: github.event_name == 'push' && github.repository == 'wakairo/NewLang_Compiler' && github.ref == 'refs/heads/t430-verified-deb-cache-trial'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout T430 source and frozen lock
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Enumerate exact T430 cache paths without downloading packages
        id: manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          raw = Path("scripts/toolchain-lock.json").read_bytes()
          digest = hashlib.sha256(raw).hexdigest()
          if digest != "dd0a726af2b91f32ffbbbd9412dfc5a4a82f48bb40ac08d6fcc4e4ab1ae06b4d":
              raise SystemExit("T441 STOP: historical lock SHA mismatch")
          lock = json.loads(raw)
          if lock["llvm_version"] != "23.1.2" or lock["llvm_source_commit"] != "85ac560262434c9ccfc0c183ec22d4138ed647fb":
              raise SystemExit("T441 STOP: wrong LLVM tag/commit")
          packages = lock["platforms"]["ubuntu-24.04-x86_64"]["packages"]
          if len(packages) != 12:
              raise SystemExit("T441 STOP: locked package count changed")
          files = []
          for package in packages:
              name, sha = package["name"], package["sha256"]
              if not re.fullmatch(r"[A-Za-z0-9+_.-]+", name) or not re.fullmatch(r"[0-9a-f]{64}", sha):
                  raise SystemExit("T441 STOP: unsafe manifest")
              files.append(f".deps/downloads/{name}-{sha}.deb")
          if len(set(files)) != 12:
              raise SystemExit("T441 STOP: duplicate cache member")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("paths<<T441_PATHS\n" + "\n".join(files) + "\nT441_PATHS\n")
          print(f"T441 manifest: 12 exact paths; full lock sha256={digest}")
          PY
      - name: Restore original trusted-branch T430 cache, never save
        id: restore
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: ${{ steps.manifest.outputs.paths }}
          key: t430-locked-deb-v1-Linux-X64-dd0a726af2b91f32ffbbbd9412dfc5a4a82f48bb40ac08d6fcc4e4ab1ae06b4d
          enableCrossOsArchive: false
          fail-on-cache-miss: true
      - name: Fail-closed audit of restored original bytes
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, stat
          from pathlib import Path
          if os.environ.get("CACHE_HIT") != "true":
              raise SystemExit("T441 STOP: no exact restored cache hit")
          packages = json.loads(Path("scripts/toolchain-lock.json").read_text())["platforms"]["ubuntu-24.04-x86_64"]["packages"]
          expected = {f"{p['name']}-{p['sha256']}.deb": p for p in packages}
          base = Path(".deps")
          target = base / "downloads"
          for path in (base, target):
              if path.is_symlink() or not path.is_dir():
                  raise SystemExit(f"T441 STOP: bad cache directory {path}")
          folders = []
          observed = []
          for root, dirs, files in os.walk(base, followlinks=False):
              directory = Path(root)
              folders.append(directory.as_posix())
              for d in dirs:
                  path = directory / d
                  if path.is_symlink() or not path.is_dir():
                      raise SystemExit(f"T441 STOP: non-directory/symlink {path}")
              for f in files:
                  path = directory / f
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit(f"T441 STOP: non-regular cached member {path}")
                  observed.append(path)
          if set(folders) != {".deps", ".deps/downloads"}:
              raise SystemExit(f"T441 STOP: extra cached directories {folders}")
          actual = {p.name for p in observed if p.parent == target}
          if len(observed) != 12 or actual != set(expected):
              raise SystemExit(f"T441 STOP: cached inventory differs, missing/extra={set(expected) ^ actual}")
          raw_index = Path("scripts/toolchain-provenance/trixie-23/Packages").read_bytes()
          release = Path("scripts/toolchain-provenance/trixie-23/Release").read_text()
          index_sha = hashlib.sha256(raw_index).hexdigest()
          matching = [line.split() for line in release.splitlines()
                      if len(line.split()) == 3 and line.split()[2] == "main/binary-amd64/Packages"
                      and re.fullmatch(r"[0-9a-f]{64}", line.split()[0])]
          if len(matching) != 1 or matching[0][0] != index_sha or int(matching[0][1]) != len(raw_index):
              raise SystemExit("T441 STOP: original publisher Packages/Release SHA mismatch")
          records = {}
          for chunk in raw_index.decode().split("\n\n"):
              fields = {}
              for line in chunk.splitlines():
                  if ":" in line and not line.startswith(" "):
                      k, v = line.split(":", 1)
                      fields[k] = v.strip()
              if "Package" in fields:
                  records[fields["Package"]] = fields
          for p in packages:
              path = target / f"{p['name']}-{p['sha256']}.deb"
              size = path.stat().st_size
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if not size or digest != p["sha256"]:
                  raise SystemExit(f"T441 STOP: size/digest mismatch {p['name']}")
              if p["name"] != "libz3-4":
                  rec = records.get(p["name"])
                  if rec is None or rec.get("SHA256") != digest or rec.get("Version") != p["version"] or int(rec["Size"]) != size or not p["url"].endswith(rec["Filename"]):
                      raise SystemExit(f"T441 STOP: signed publisher inventory mismatch {p['name']}")
              print(f"T441 VERIFIED name={p['name']} size={size} sha256={digest}" +
                    (" size_source=frozen_signed_trixie_Packages" if p["name"] != "libz3-4" else " size_source=actual_only_lock_has_no_size"))
          print("T441 12/12 ACTUAL RESTORED BYTES SHA256 VERIFIED; no package GET, no cache save, no bootstrap")
          PY
