name: P419 unchanged compiler preflight
on:
  push:
    branches: [p419-nested-u8call-explore]
permissions:
  contents: read
jobs:
  unchanged:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 54e1cbebfd82dddf3e9746f296ffbf908646b00d
          path: baseline
      - name: Host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13 g++-13 make cmake python3 dpkg libstdc++6 libz3-4 libxml2 libpfm4 libedit2 libzstd1 libffi8
      - name: Fixed production with test-only probe
        env:
          CC: gcc-13
        run: |
          test "$(git -C baseline rev-parse HEAD)" = 54e1cbebfd82dddf3e9746f296ffbf908646b00d
          cp tests/integration/nested_u8_checked_probe.c baseline/tests/integration/
          printf '\nadd_executable(nested_u8_checked_probe tests/integration/nested_u8_checked_probe.c)\ntarget_link_libraries(nested_u8_checked_probe PRIVATE newlang_checked_c_node newlang_semantic)\n' >> baseline/CMakeLists.txt
          cd baseline
          python3 scripts/bootstrap.py
          . .deps/activate.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target newlangc nested_u8_checked_probe --parallel 2
          for source in ../evidence/p419/*.nl; do
            sha256sum "$source"
            build/nested_u8_checked_probe "$source"
            status=0
            build/newlangc "$source" > /tmp/p419.c 2>/tmp/p419.err || status=$?
            cat /tmp/p419.err
            echo "CLI=$status C_BYTES=$(wc -c </tmp/p419.c) NATIVE=NOT_REACHED"
            test "$status" = 4
            test ! -s /tmp/p419.c
            grep -F 'V1-BACKEND-UNSUPPORTED' /tmp/p419.err
          done
