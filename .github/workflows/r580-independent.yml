name: R580 fixed-candidate independent BLIND first-pass
on:
  push:
    branches: [r580-blind-evidence-20261017]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r580-fixed-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout R-frozen independent evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: evidence
      - name: Checkout EXACT fixed compiler without studying candidate changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: 87fc878b52763858f69678a8350d8c1b66a061bb
          path: candidate
      - name: Verify immutable authorities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "87fc878b52763858f69678a8350d8c1b66a061bb"
          git -C evidence cat-file -e 38e1dbd2874c12983635ae4e7ff320f94566b613:tests/r580/frozen_oracle.json
          python3 -m json.tool evidence/tests/r580/frozen_oracle.json >/dev/null
          git -C candidate rev-parse HEAD
          git -C evidence log -1 --format='%H %s'
      - name: Attach independent public inspector as test-only CMake target
        shell: bash
        run: |
          set -euo pipefail
          cat >> candidate/CMakeLists.txt <<'CMAKE'
          add_executable(r580_public_probe "${CMAKE_CURRENT_SOURCE_DIR}/../evidence/tests/r580/public_probe.c")
          target_include_directories(r580_public_probe PRIVATE "${CMAKE_CURRENT_SOURCE_DIR}/tests/support")
          target_link_libraries(r580_public_probe PRIVATE newlang_semantic)
          CMAKE
          cmake -S candidate -B candidate/build -DCMAKE_BUILD_TYPE=Debug -DNEWLANG_FRONTEND_ONLY=ON
          cmake --build candidate/build --parallel 2 --target newlangc node_checked_probe r580_public_probe
      - name: Run pre-frozen real SOURCE/CHECK/public/C17/GCC-Clang O0-O2 and negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -u evidence/tests/r580/firstpass.py \
            candidate/build/newlangc \
            candidate/build/node_checked_probe \
            candidate/build/r580_public_probe \
            candidate/build
