name: P346 public diagnostic export ONLY (DO NOT MERGE)
on:
  push:
    branches: [p346-public-diagnostic-export]
permissions:
  contents: read
jobs:
  diagnostic-export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Pin immutable P340 parent and evidence-only additions
        run: |
          test "$(git rev-parse HEAD^)" = dc0fc7e7d2f9f92286973a4f5062089acf0d85f2
          python3 - <<'PY'
          import subprocess
          for line in subprocess.check_output(['git','diff','--name-status','dc0fc7e7d2f9f92286973a4f5062089acf0d85f2','HEAD'],text=True).splitlines():
              status,path=line.split('\t')
              assert status=='A' and (path.startswith('evidence/p346/') or path=='.github/workflows/p346-public-observation.yml' or path=='docs/experiments/P346_PUBLIC_DIAGNOSTIC_EXPORT.md'),line
          PY
          git fetch --no-tags origin 46a02e60cabce1b63cc3db4bc9035fe06f5f8009
      - name: Install existing checksum-bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13 g++-13 make cmake python3 dpkg libstdc++6 libz3-4 libxml2 libpfm4 libedit2 libzstd1 libffi8
      - name: Bootstrap unchanged locked LLVM; standard format check
        run: |
          python3 scripts/bootstrap.py
          . .deps/activate.sh
          bash scripts/check-format.sh
      - name: Reproduce live source validation and untrusted diagnostic export
        env:
          CC: gcc-13
        run: |
          . .deps/activate.sh
          bash evidence/p346/run.sh build-p346 build-p346/p346-export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p346-diagnostic-only-no-authority
          path: |
            build-p346/p346-export/*.json
            build-p346/p338-observations.json
