name: R1101 independent strict native original (R-only; NOT Product GO)

on:
  push:
    branches:
      - 'r-fast/r1101-loop-break-native'

permissions:
  contents: read

jobs:
  native-independent:
    name: R1101 source/native ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc-13
            guest_cc: gcc-13
            sanitizer: none
          - name: Clang
            compiler: clang-23
            guest_cc: clang-23
            sanitizer: none
          - name: ASan
            compiler: clang-23
            guest_cc: clang-23
            sanitizer: address
          - name: UBSan
            compiler: clang-23
            guest_cc: clang-23
            sanitizer: undefined
    steps:
      - name: Checkout exact immutable R push commit, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check historical P and V1 byte boundaries, fail closed
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/r-fast/r1101-loop-break-native
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 6ee04e0eaef593e151641da2bf5dda50f9fcb47e HEAD
          test "$(git merge-base HEAD 6ee04e0eaef593e151641da2bf5dda50f9fcb47e)" = 6ee04e0eaef593e151641da2bf5dda50f9fcb47e
          test -z "$(git diff --name-only 6ee04e0eaef593e151641da2bf5dda50f9fcb47e HEAD -- CMakeLists.txt cmake/ .github/workflows/compiler-ci.yml .github/workflows/compiler-frontend-ci.yml tests/p990/)"
          echo 'b9f8a62abfa6cd7a6c4838623cdbb94dee3f0e412af03e358e3aea60249888c4  CMakeLists.txt' | sha256sum --check --status
          echo 'ecd14067f30cac138607b606916e84464b2391b61703ebe2e530940e27ec64af  cmake/independent-r-tests-hook.cmake' | sha256sum --check --status
          sha256sum --check tests/r1101/v2-forward-only-sha256.txt
          test -z "$(git status --porcelain)"
          echo "R1101 GITHUB-ONLY immutable_SHA=$GITHUB_SHA event=$GITHUB_EVENT_NAME attempt=$GITHUB_RUN_ATTEMPT"
          echo 'R1101 P990 CMake/hook SHA256 PASS; V1 source bytes preserved; V2 manifest PASS'

      - name: Signed Ubuntu host prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13 g++-13 make python3 zstd libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev

      - name: Restore fixed curated LLVM SDK archive from cache, never trust without SHA bootstrap
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133

      - name: Bootstrap pinned compiler SDK and build unchanged Production frontend
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: ${{ matrix.compiler == 'clang-23' && '-Wno-error=gcc-install-dir-libstdcxx' || '' }}
        run: |
          set -euo pipefail
          python3 scripts/bootstrap.py
          . .deps/activate.sh
          cmake -S . -B build-r1101 -DCMAKE_BUILD_TYPE=Debug \
            -DNEWLANG_FRONTEND_ONLY=ON -DNEWLANG_SANITIZER=none \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/cmake/independent-r-tests-hook.cmake"
          cmake --build build-r1101 --target newlangc --parallel "$(nproc)"
          test -x build-r1101/newlangc
          ctest --test-dir build-r1101 -N | tee "$RUNNER_TEMP/r1101-ctest-inventory.txt"

      - name: Independent actual source CHECK, authentic C17 and native original observation
        shell: bash
        env:
          R1101_ARTIFACT_DIR: ${{ runner.temp }}/r1101-raw
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          . .deps/activate.sh
          mkdir -p "$R1101_ARTIFACT_DIR"
          echo "R1101 native job ${{ matrix.name }} fixed Git SHA=$GITHUB_SHA"
          python3 tests/r1101/runner.py \
            "$GITHUB_WORKSPACE/build-r1101/newlangc" "${{ matrix.guest_cc }}" \
            "${{ matrix.sanitizer }}" "$GITHUB_WORKSPACE/tests/r1101" p01 \
            2>&1 | tee "$R1101_ARTIFACT_DIR/p01-runner.log"
          python3 tests/r1101/runner.py \
            "$GITHUB_WORKSPACE/build-r1101/newlangc" "${{ matrix.guest_cc }}" \
            "${{ matrix.sanitizer }}" "$GITHUB_WORKSPACE/tests/r1101" negative \
            2>&1 | tee "$R1101_ARTIFACT_DIR/negative-runner.log"
          python3 tests/r1101/runner.py \
            "$GITHUB_WORKSPACE/build-r1101/newlangc" "${{ matrix.guest_cc }}" \
            "${{ matrix.sanitizer }}" "$GITHUB_WORKSPACE/tests/r1101" p02 \
            2>&1 | tee "$R1101_ARTIFACT_DIR/p02-runner.log"

      - name: Preserve actual R-owned raw command stdout/stderr and runner logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r1101-native-${{ matrix.name }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/r1101-raw/
          if-no-files-found: warn
          retention-days: 30
