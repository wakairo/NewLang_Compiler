name: T1678 ASan shadow pilot (NON-REQUIRED)
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths: ['.github/workflows/t1678-asan-shadow.yml']
permissions:
  contents: read

jobs:
  shadow:
    if: >-
      github.repository == 'wakairo/NewLang_Compiler' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 't/t1678-asan-shadow' &&
      github.event.pull_request.draft &&
      github.event.pull_request.title == '[T #1678 DRAFT NEVERMERGE] ASan hosted shadow pilot' &&
      github.event.pull_request.base.sha == 'dbf31102d99110715513083e1bb6a32fc5bc83e8' &&
      github.run_attempt == 1
    name: T1678 ASan ${{ matrix.lane }} (NON-REQUIRED)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: Heavy-1, workers: 1}
          - {lane: Heavy-2, workers: 2}
          - {lane: Light-3, workers: 3}
          - {lane: Light-4, workers: 4}
    env:
      T1678_BASE: 'dbf31102d99110715513083e1bb6a32fc5bc83e8'
      T1678_BASE_TREE: 'b36f4ca29b85a7f71212e472d8df4f7f501fca83'
      T1678_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      T1678_PR_NUMBER: ${{ github.event.pull_request.number }}
      T1678_LANE: ${{ matrix.lane }}
      T1678_WORKERS: ${{ matrix.workers }}
    steps:
      - name: Begin shadow evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/t1678-evidence"
          date -u +%s > "$RUNNER_TEMP/t1678-evidence/job-start.epoch"
      - name: Checkout the same immutable PR merge SHA as Required
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact checkout, patch boundary and trust inputs
        run: python3 .github/t1678-shadow/run.py checkout
      - name: Host prerequisites from signed Ubuntu repositories
        shell: bash
        run: |
          set -euo pipefail
          cmake_before=$(command -v cmake)
          version_before=$(cmake --version | sed -n '1s/^cmake version //p')
          python3 - "$version_before" <<'PY'
          import re
          import sys
          version = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", sys.argv[1])
          if version is None or not (3, 28) <= tuple(map(int, version.groups()[:2])) < (4, 0):
              sys.exit("Unsupported preinstalled CMake")
          PY
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gcc-13 g++-13 make python3 zstd \
            libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev
          test "$(command -v cmake)" = "$cmake_before"
          test "$(cmake --version | sed -n '1s/^cmake version //p')" = "$version_before"
      - name: Restore untrusted cache for repository verification
        id: sdk-cache
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133
      - name: Bootstrap SHA-verified curated LLVM 23.1.3
        run: python3 scripts/bootstrap.py
      - name: Verify inventory and execute the exact shadow selection
        shell: bash
        env:
          CC: clang-23
          CFLAGS: -Wno-error=gcc-install-dir-libstdcxx
          T1678_SDK_CACHE_HIT: ${{ steps.sdk-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          . .deps/activate.sh
          python3 .github/t1678-shadow/run.py run
      - name: Seal shadow evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/t1678-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload original shadow evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t1678-asan-${{ matrix.lane }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/t1678-evidence
          if-no-files-found: error
          retention-days: 7
