name: T C374 early GO (NON-REQUIRED)
on:
  pull_request:
    types: [opened]
    branches: [main]
permissions:
  contents: read
jobs:
  early:
    if: github.event.pull_request.head.ref == 't/c374-simple-early-go' && github.event.pull_request.head.repo.full_name == github.repository
    name: T C374 EARLY ${{ matrix.name }} (NON-REQUIRED)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ASan, sanitizer: address}
          - {name: UBSan, sanitizer: undefined}
    env:
      CC: clang-23
      CFLAGS: -Wno-error=gcc-install-dir-libstdcxx
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Existing signed Ubuntu prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13 g++-13 make python3 zstd libstdc++6 zlib1g-dev libzstd-dev libtinfo-dev libxml2-dev
          case "$(cmake --version | head -n1)" in "cmake version 3."*) ;; *) exit 1;; esac
      - uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .deps/downloads/newlang-llvm-23.1.3-linux-x64-final.tar.zst
          key: t449-ubuntu-24.04-x86_64-5369d292ef513d32758634f98ec7cf62c52f82a0a333eb330ecf9a325648b133
      - run: python3 scripts/bootstrap.py
      - name: Configure unchanged sanitizer targets
        run: |
          . .deps/activate.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEWLANG_SANITIZER=${{ matrix.sanitizer }} \
            -DCMAKE_PROJECT_INCLUDE="$GITHUB_WORKSPACE/cmake/independent-r-tests-hook.cmake"
      - name: Build
        run: |
          . .deps/activate.sh
          cmake --build build --parallel "$(nproc)"
      - name: Existing 84 CTests (success permits next work, not merge)
        shell: bash
        run: |
          set -euo pipefail
          . .deps/activate.sh
          names=(
            source.unit lexer.unit parser_type.unit
            parser_expression.unit parser_loan.unit parser_ownership.unit
            parser_limits.unit parser_diagnostics.unit semantic_type.unit
            semantic_value_use.unit semantic_domain.unit semantic_transition.unit
            semantic_loan.unit semantic_failure.unit raw_claim.unit
            raw_access.unit raw_current.unit raw_failure.unit
            raw_reborrow.unit raw_partition.unit raw_storage_cycle.integration
            local_root_evidence.unit local_root_direct_write_root.unit local_root_negatives.unit
            local_root_conflict.unit local_root_failures.unit local_root_resource.unit
            fixed_field_state.unit fixed_field_evidence.unit fixed_field_dependencies.unit
            fixed_field_negatives.unit fixed_field_failures.unit recursive_type_identity.unit
            recursive_type_source.unit recursive_type_cycle.unit recursive_type_negatives.unit
            recursive_type_failures.unit typed_owner_definition.unit typed_owner_evidence.unit
            typed_owner_precision.unit typed_owner_faults.unit custody_source_evidence.unit
            custody_definition_evidence.unit custody_codegen_oom.unit node_join_same_locator_public_proof.unit
            node_join_public_negative.unit node_join_owned_poison.unit node_join_public_oom.unit
            source_lexer.integration source_parser.integration source_semantic.integration
            cli.check_source local_root_checked_c.integration fixed_field_checked_c.integration
            custody_native.integration p517_r516_composition_native.integration p990_new_native.integration
            p990_negative_sources.integration p1236_source_native.integration p1248_source_native.integration
            p1253_source_native.integration p1260_source_native.integration p1208_negative.unit
            p1193_90-wrong-return-type_boundary.unit p1193_91-helper-break_boundary.unit p1193_95-mixed-result-binding_boundary.unit
            p1217_resource_status.unit p1117_native.integration p1123_native.integration
            p1133_native.integration p1158_native.integration p1152_native.integration
            p1208_combined_source.unit p1208_oom.unit p1123_11-prefix-current_current.unit
            p1123_11-prefix-current_oom.unit p1193_signature_return_auth.unit p1193_signature_oom.unit
            p1260_oom.unit p1227_oom.unit p1227_c283_alias_oom.unit
            p1272_source_native.integration p1272_oom.unit p1272_named_oom.integration
          )
          regex="^($(IFS='|'; echo "${names[*]}"))$"
          regex=${regex//./\\.}
          ctest --test-dir build -N -R "$regex" | tee "$RUNNER_TEMP/c374-list.txt"
          test "$(sed -n 's/^Total Tests: //p' "$RUNNER_TEMP/c374-list.txt")" = "${#names[@]}"
          workers=$(nproc)
          if (( workers > 3 )); then workers=3; fi
          time ctest --test-dir build --parallel "$workers" -R "$regex" --no-tests=error \
            --output-on-failure --output-log "$RUNNER_TEMP/c374-ctest.log"
      - name: Standard CTest logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c374-${{ matrix.name }}-ctest
          path: |
            ${{ runner.temp }}/c374-*
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7
