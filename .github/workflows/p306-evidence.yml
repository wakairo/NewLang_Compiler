name: P306 frozen moved-original Domain evidence ONLY
on:
  push:
    branches: [p306-moved-original-domain-reloan]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            compiler: gcc-13
            build_type: Debug
            sanitizer: none
          - name: GCC Release
            compiler: gcc-13
            build_type: Release
            sanitizer: none
          - name: Clang
            compiler: clang-23
            build_type: Debug
            sanitizer: none
          - name: ASan-LSan
            compiler: clang-23
            build_type: Debug
            sanitizer: address
          - name: UBSan
            compiler: clang-23
            build_type: Debug
            sanitizer: undefined
    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.compiler }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assert immutable PR302 compiler and original tests
        run: |
          git merge-base --is-ancestor b28a49755f1bc254b6a8f7c337e5e1866d9483b8 HEAD
          git diff --exit-code b28a49755f1bc254b6a8f7c337e5e1866d9483b8 -- src include CMakeLists.txt tests docs .github/workflows/compiler-ci.yml
      - name: Install compiler and runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-13 g++-13 make cmake python3 dpkg libstdc++6 libz3-4 libxml2 libpfm4 libedit2 libzstd1 libffi8
      - name: Bootstrap checksum-locked LLVM
        run: python3 scripts/bootstrap.py
      - name: Build fixed six-opt-in compiler and run regressions
        run: |
          . .deps/activate.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNEWLANG_SANITIZER=${{ matrix.sanitizer }} \
            -DNEWLANG_EXPERIMENTAL_ORIGINAL_GRANT=ON -DNEWLANG_EXPERIMENTAL_NESTED_CALLER=ON \
            -DNEWLANG_EXPERIMENTAL_TRANSITIVE_TERMINAL=ON -DNEWLANG_EXPERIMENTAL_OWNER_AGGREGATES=ON \
            -DNEWLANG_EXPERIMENTAL_THREE_ARG_OWNER_CALL=ON -DNEWLANG_EXPERIMENTAL_SCOPED_FIELD_CALL=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - name: P306 actual source, owned identity, rollback, OOM and validator contrasts
        run: |
          . .deps/activate.sh
          bash evidence/p306/build_observer.sh build ${{ matrix.sanitizer }}
          python3 evidence/p306/run.py build/newlangc build/p306_owned_observer build/five_root_source_gate_evidence build/scoped_field_evidence build/p306-observations.json
          build/captured_closure_test full-scoped-poison evidence/p306/held_B_next_None.nl
          sha256sum build/newlangc > build/p306-compiler-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p306-${{ matrix.name }}
          path: |
            build/p306-observations.json
            build/p306-compiler-sha256.txt
            build/Testing/Temporary/LastTest.log
